services:
  - type: web
    name: drpay-api
    repo: https://github.com/drltechgroup202/drpay-merchant
    branch: main
    runtime: node
    plan: starter
    region: oregon
    buildCommand: corepack enable && corepack prepare pnpm@10.34.3 --activate && pnpm install --frozen-lockfile && pnpm check:api
    startCommand: node server/index.js
    healthCheckPath: /readyz
    domains:
      - api.sandbox.paypulse.live
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: drpay-postgres
          property: connectionString
      - key: DATABASE_SSL
        value: "false"
      - key: DRPAY_FRONTEND_ORIGIN
        value: https://sandbox.paypulse.live
      - key: DRPAY_ADDITIONAL_FRONTEND_ORIGINS
        value: https://paypulse.live,https://www.paypulse.live,https://sandbox.paypulse.live,https://drpay-web-iv2y.onrender.com,https://drpay-sandbox-web.onrender.com
      - key: DRPAY_LIVE_CHECKOUT_ORIGIN
        value: https://paypulse.live
      - key: DRPAY_SANDBOX_CHECKOUT_ORIGIN
        value: https://sandbox.paypulse.live
      - key: DRPAY_PUBLIC_API_ORIGIN
        value: https://api.sandbox.paypulse.live
      - key: DRPAY_MERCHANT_EMAIL
        sync: false
      - key: DRPAY_SUPER_ADMIN_EMAIL
        sync: false
      - key: DRPAY_SUPER_ADMIN_PASSWORD
        sync: false
      - key: DRPAY_PASSWORD_SALT
        sync: false
      - key: DRPAY_JWT_SECRET
        sync: false
      - key: DRPAY_GOOGLE_CLIENT_ID
        sync: false
      - key: DRPAY_TELEGRAM_LOGIN_CLIENT_ID
        sync: false
      - key: DRPAY_PASSKEY_RP_ID
        value: sandbox.paypulse.live
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: FCM_PROJECT_ID
        sync: false
      - key: FCM_SERVICE_ACCOUNT_EMAIL
        sync: false
      - key: FCM_SERVICE_ACCOUNT_PRIVATE_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: DRPAY_MAX_TRANSFER_PHP
        value: "100000"
      - key: SWIFTPAY_ENV
        value: sandbox
      - key: SWIFTPAY_ACCESS_KEY
        sync: false
      - key: SWIFTPAY_SECRET_KEY
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: TRON_USDT_NETWORK
        value: disabled
  - type: web
    name: drpay-live-api
    branch: Production
    runtime: node
    plan: starter
    region: oregon
    buildCommand: corepack enable && corepack prepare pnpm@10.34.3 --activate && pnpm install --frozen-lockfile && pnpm check:api
    startCommand: node server/index.js
    healthCheckPath: /readyz
    domains:
      - api.paypulse.live
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: drpay-live-postgres
          property: connectionString
      - key: DATABASE_SSL
        value: "false"
      - key: DRPAY_FRONTEND_ORIGIN
        value: https://paypulse.live
      - key: DRPAY_ADDITIONAL_FRONTEND_ORIGINS
        value: https://paypulse.live,https://www.paypulse.live,https://sandbox.paypulse.live,https://drpay-web-iv2y.onrender.com,https://drpay-sandbox-web.onrender.com
      - key: DRPAY_LIVE_CHECKOUT_ORIGIN
        value: https://paypulse.live
      - key: DRPAY_SANDBOX_CHECKOUT_ORIGIN
        value: https://sandbox.paypulse.live
      - key: DRPAY_PUBLIC_API_ORIGIN
        value: https://api.paypulse.live
      - key: DRPAY_MERCHANT_EMAIL
        sync: false
      - key: DRPAY_SUPER_ADMIN_EMAIL
        sync: false
      - key: DRPAY_SUPER_ADMIN_PASSWORD
        sync: false
      - key: DRPAY_PASSWORD_SALT
        sync: false
      - key: DRPAY_ADMIN_MFA_ENCRYPTION_KEY
        sync: false
      - key: DRPAY_JWT_SECRET
        sync: false
      - key: DRPAY_GOOGLE_CLIENT_ID
        sync: false
      - key: DRPAY_TELEGRAM_LOGIN_CLIENT_ID
        sync: false
      - key: DRPAY_PASSKEY_RP_ID
        value: paypulse.live
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: FCM_PROJECT_ID
        sync: false
      - key: FCM_SERVICE_ACCOUNT_EMAIL
        sync: false
      - key: FCM_SERVICE_ACCOUNT_PRIVATE_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: DRPAY_MAX_TRANSFER_PHP
        value: "100000"
      - key: SWIFTPAY_ENV
        value: production
      - key: SWIFTPAY_LIVE_MONEY_ACKNOWLEDGED
        value: I_UNDERSTAND_REAL_MONEY
      - key: SWIFTPAY_ACCESS_KEY
        sync: false
      - key: SWIFTPAY_SECRET_KEY
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: TATUM_API_KEY
        sync: false
      - key: TRONGRID_API_KEY
        sync: false
      - key: TRON_USDT_NETWORK
        value: mainnet
  # Existing Render service ID: srv-dbv0r9t6e07s73acimn0
  - type: web
    name: drpay-web
    branch: Production
    runtime: static
    buildCommand: node scripts/download-latest-apk.mjs && corepack enable && corepack prepare pnpm@10.34.3 --activate && pnpm install --frozen-lockfile && pnpm typecheck && pnpm build
    staticPublishPath: dist
    domains:
      - paypulse.live
      - www.paypulse.live
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DRPAY_GITHUB_RELEASE_TOKEN
        sync: false
      - key: DRPAY_GITHUB_RELEASE_REPOSITORY
        value: drltechgroup202/drpay-merchant
      - key: VITE_DRPAY_BACKEND_URL
        value: https://api.paypulse.live
      - key: VITE_DRPAY_MERCHANT_SIGNIN_URL
        value: https://paypulse.live/login
      - key: VITE_DRPAY_LIVE_BACKEND_URL
        value: https://api.paypulse.live
      - key: VITE_DRPAY_SANDBOX_BACKEND_URL
        value: https://api.sandbox.paypulse.live
    routes:
      - type: rewrite
        source: /checkout/*
        destination: /index.html
      - type: rewrite
        source: /app
        destination: /index.html
      - type: rewrite
        source: /login
        destination: /index.html
      - type: rewrite
        source: /app/*
        destination: /index.html
      - type: rewrite
        source: /bossd
        destination: /index.html
      - type: rewrite
        source: /bossd/*
        destination: /index.html
      - type: rewrite
        source: /privacy
        destination: /index.html
      - type: rewrite
        source: /privacy-policy
        destination: /index.html
      - type: rewrite
        source: /terms
        destination: /index.html
      - type: rewrite
        source: /terms-of-service
        destination: /index.html
      - type: rewrite
        source: /contact
        destination: /index.html
      - type: rewrite
        source: /contact-us
        destination: /index.html
  - type: web
    name: drpay-sandbox-web
    repo: https://github.com/drltechgroup202/drpay-merchant
    branch: main
    runtime: static
    buildCommand: corepack enable && corepack prepare pnpm@10.34.3 --activate && pnpm install --frozen-lockfile && pnpm typecheck && pnpm build
    staticPublishPath: dist
    domains:
      - sandbox.paypulse.live
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_DRPAY_BACKEND_URL
        value: https://api.sandbox.paypulse.live
      - key: VITE_DRPAY_MERCHANT_SIGNIN_URL
        value: https://sandbox.paypulse.live/login
      - key: VITE_DRPAY_LIVE_BACKEND_URL
        value: https://api.paypulse.live
      - key: VITE_DRPAY_SANDBOX_BACKEND_URL
        value: https://api.sandbox.paypulse.live
    routes:
      - type: rewrite
        source: /checkout/*
        destination: /index.html
      - type: rewrite
        source: /app
        destination: /index.html
      - type: rewrite
        source: /login
        destination: /index.html
      - type: rewrite
        source: /app/*
        destination: /index.html
      - type: rewrite
        source: /bossd
        destination: /index.html
      - type: rewrite
        source: /bossd/*
        destination: /index.html
      - type: rewrite
        source: /privacy
        destination: /index.html
      - type: rewrite
        source: /privacy-policy
        destination: /index.html
      - type: rewrite
        source: /terms
        destination: /index.html
      - type: rewrite
        source: /terms-of-service
        destination: /index.html
      - type: rewrite
        source: /contact
        destination: /index.html
      - type: rewrite
        source: /contact-us
        destination: /index.html

databases:
  - name: drpay-postgres
    databaseName: drpay
    user: drpay
    plan: basic-256mb
    region: oregon
  - name: drpay-live-postgres
    databaseName: drpay_live
    user: drpay_live
    plan: basic-256mb
    region: oregon
