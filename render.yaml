services:
  - type: web
    name: drpay-api
    runtime: node
    plan: starter
    region: oregon
    buildCommand: corepack enable && corepack prepare pnpm@10.34.3 --activate && pnpm install --frozen-lockfile && pnpm check:api
    startCommand: pnpm start:api
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: drpay-postgres
          property: connectionString
      - key: DATABASE_SSL
        value: "false"
      - key: DRPAY_FRONTEND_ORIGIN
        value: https://drpay-web.onrender.com
      - key: DRPAY_MERCHANT_EMAIL
        sync: false
      - key: DRPAY_MERCHANT_PASSWORD
        sync: false
      - key: DRPAY_PASSWORD_SALT
        sync: false
      - key: DRPAY_JWT_SECRET
        sync: false
      - key: DRPAY_MAX_TRANSFER_PHP
        value: "100000"
      - key: SWIFTPAY_ENV
        value: sandbox
      - key: SWIFTPAY_ACCESS_KEY
        sync: false
      - key: SWIFTPAY_SECRET_KEY
        sync: false
  - type: web
    name: drpay-web
    runtime: static
    buildCommand: corepack enable && corepack prepare pnpm@10.34.3 --activate && pnpm install --frozen-lockfile && pnpm typecheck && pnpm build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: VITE_DRPAY_BACKEND_URL
        value: https://drpay-api.onrender.com
      - key: VITE_ANDROID_APK_URL
        sync: false
    routes:
      - type: rewrite
        source: /app
        destination: /index.html
      - type: rewrite
        source: /app/*
        destination: /index.html

databases:
  - name: drpay-postgres
    databaseName: drpay
    user: drpay
    plan: basic-256mb
    region: oregon
