name: Publish DRPAY Google Play store listing

on:
  push:
    branches:
      - Production
    paths:
      - android/play-listing/en-US/**

permissions:
  contents: read
  id-token: write

jobs:
  publish-listing:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Authenticate to Google Cloud with Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Publish store listing
        run: |
          python3 -m pip install --disable-pip-version-check "google-auth[requests]>=2,<3"
          python3 android/publish_to_play.py --update-listing