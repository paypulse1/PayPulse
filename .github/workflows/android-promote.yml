name: Promote DRPAY Android release to production

on:
  push:
    tags:
      - "android-prod-v*"
  workflow_dispatch:
    inputs:
      action:
        description: Promote an existing release or inspect its Play Store state
        type: choice
        options:
          - inspect
          - promote
        default: inspect
        required: true

permissions:
  contents: read

jobs:
  promote-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Promote existing release to Google Play production
        if: github.event_name == 'push' || inputs.action == 'promote'
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          ANDROID_RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 -m pip install --disable-pip-version-check "google-auth[requests]>=2,<3"
          python3 android/publish_to_play.py --promote-existing "$ANDROID_RELEASE_TAG"

      - name: Inspect Google Play production track and store listings
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'inspect'
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          python3 -m pip install --disable-pip-version-check "google-auth[requests]>=2,<3"
          python3 android/publish_to_play.py --check-production
