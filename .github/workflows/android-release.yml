name: DRPAY Android release

on:
  push:
    tags:
      - "android-v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install pnpm and dependencies
        run: |
          corepack enable
          corepack prepare pnpm@10.34.3 --activate
          pnpm install --frozen-lockfile

      - name: Verify and build web assets
        env:
          VITE_DRPAY_BACKEND_URL: ${{ vars.DRPAY_API_URL || 'https://drpay-api.onrender.com' }}
          VITE_ANDROID_APK_URL: https://github.com/${{ github.repository }}/releases/latest/download/drpay.apk
        run: |
          pnpm typecheck
          pnpm build
          pnpm exec cap sync android

      - name: Prepare release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          mkdir -p android/app
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          chmod 600 android/app/release.keystore

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          cd android
          ./gradlew --no-daemon assembleRelease

      - name: Prepare direct-download artifact
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk release/drpay.apk

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: DRPAY ${{ github.ref_name }}
          generate_release_notes: true
          files: release/drpay.apk
