name: DRPAY Android release

on:
  push:
    tags:
      - "android-v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Install pnpm and dependencies
        run: |
          corepack enable
          corepack prepare pnpm@10.34.3 --activate
          pnpm install --frozen-lockfile

      - name: Verify and build web assets
        env:
          VITE_DRPAY_BACKEND_URL: ${{ vars.DRPAY_API_URL || 'https://drpay-merchant-production.up.railway.app' }}
        run: |
          pnpm typecheck
          pnpm build
          pnpm exec cap sync android

      - name: Prepare release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          mkdir -p android/app
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          chmod 600 android/app/release.keystore

      - name: Build signed release APK and app bundle
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          version="${GITHUB_REF_NAME#android-v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use android-vMAJOR.MINOR.PATCH." >&2
            exit 1
          fi
          IFS=. read -r major minor patch <<< "$version"
          export ANDROID_VERSION_CODE=$((major * 1000000 + minor * 1000 + patch))
          export ANDROID_VERSION_NAME="$version"
          echo "Building Android version $ANDROID_VERSION_NAME ($ANDROID_VERSION_CODE)"
          cd android
          ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Verify release signatures
        run: "$ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose android/app/build/outputs/apk/release/app-release.apk"

      - name: Verify app bundle signature
        run: jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab

      - name: Publish app bundle to Google Play internal testing
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          ANDROID_VERSION_NAME: ${{ github.ref_name }}
        run: |
          python3 -m pip install --disable-pip-version-check "google-auth[requests]>=2,<3"
          python3 android/publish_to_play.py android/app/build/outputs/bundle/release/app-release.aab

      - name: Prepare release artifacts
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk release/drpay.apk
          cp android/app/build/outputs/bundle/release/app-release.aab release/drpay.aab

      - name: Publish Android artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: DRPAY ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/drpay.apk
            release/drpay.aab
